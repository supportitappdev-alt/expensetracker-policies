<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Join a trip — Centora: Expense Tracker</title>
<style>
  :root { color-scheme: light dark; --green: #006d4b; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f4f7f5; color: #1b1c1b;
         min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  @media (prefers-color-scheme: dark) { body { background: #111412; color: #e3e3e0; } .card { background: #1c201e; } .muted { color: #a9b0ac; } }
  .card { background: #fff; border-radius: 24px; padding: 28px 24px; max-width: 380px; width: calc(100% - 40px); text-align: center;
          box-shadow: 0 6px 24px rgba(0,0,0,.08); }
  h1 { font-size: 22px; margin: 8px 0 4px; }
  .muted { color: #5f6662; font-size: 15px; line-height: 1.45; }
  .code { font-size: 32px; letter-spacing: 6px; font-weight: 700; margin: 18px 0; color: var(--green); }
  a.btn { display: block; margin: 12px 0 0; padding: 15px; border-radius: 16px; background: var(--green); color: #fff; text-decoration: none; font-weight: 600; font-size: 16px; }
  a.btn.alt { background: transparent; color: var(--green); border: 1.5px solid var(--green); }
  .icon { font-size: 40px; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">🧳</div>
  <h1>You're invited to a trip</h1>
  <p class="muted">Open it in <b>Centora: Expense Tracker</b> to see the trip's expenses and who pays whom.</p>
  <div class="code" id="code">——————</div>
  <a class="btn" id="open" href="#">Open in the app</a>
  <a class="btn alt" id="get" href="https://play.google.com/store/apps/details?id=com.supportitappdev.expensetracker">Get the app on Google Play</a>
  <p class="muted" style="margin-top:18px">Already installed but nothing opens? In the app go to <b>Trips → Join</b> and type the code above.</p>
</div>
<script>
  // The code only travels from this link to the app; this page stores and sends nothing.
  var raw = new URLSearchParams(location.search).get("c") || "";
  var code = raw.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6);
  var pkg = "com.supportitappdev.expensetracker";
  var play = "https://play.google.com/store/apps/details?id=" + pkg;
  document.getElementById("code").textContent = code || "No code";
  var open = document.getElementById("open");
  if (code) {
    open.href = "intent://join/" + code + "#Intent;scheme=" + pkg + ";package=" + pkg +
      ";S.browser_fallback_url=" + encodeURIComponent(play) + ";end";
  } else {
    open.style.display = "none";
  }
</script>
</body>
</html>
